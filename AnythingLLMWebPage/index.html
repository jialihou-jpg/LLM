<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM Web 对话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #1e1e2e; color: #cdd6f4; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: #181825; border-bottom: 1px solid #313244; font-size: 16px; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 72%; margin-bottom: 14px; padding: 10px 14px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { background: #89b4fa; color: #1e1e2e; margin-left: auto; }
  .bot { background: #313244; }
  .sys { color: #6c7086; font-size: 12px; text-align: center; }
  form { display: flex; gap: 10px; padding: 14px 20px; background: #181825; border-top: 1px solid #313244; }
  input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #313244; background: #1e1e2e; color: #cdd6f4; font-size: 14px; outline: none; }
  input:focus { border-color: #89b4fa; }
  button { padding: 10px 20px; border: none; border-radius: 8px; background: #89b4fa; color: #1e1e2e; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cfg { padding: 8px 20px; background: #11111b; font-size: 12px; color: #6c7086; display: flex; gap: 12px; align-items: center; }
  .cfg input { width: 200px; padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>
<header>AnythingLLM · Web 对话</header>
<div class="cfg">
  <span>Base URL:</span><input id="base" value="http://localhost:3001">
  <span>API Key:</span><input id="key" type="password" placeholder="Bearer token">
  <span>Workspace Slug:</span><input id="slug" placeholder="my-workspace">
</div>
<div id="chat"><div class="sys">输入问题开始对话</div></div>
<form id="f">
  <input id="q" placeholder="输入消息…" autocomplete="off">
  <button id="send" type="submit">发送</button>
</form>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat');
function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  $('q').value = '';
  add(q, 'user');
  $('send').disabled = true;
  try {
    const base = $('base').value.replace(/\/$/, '');
    const key = $('key').value.trim();
    const slug = $('slug').value.trim();
    const r = await fetch(`${base}/api/v1/workspace/${slug}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ message: q, mode: 'chat' })
    });
    if (!r.ok) { add('HTTP ' + r.status + ': ' + await r.text(), 'sys'); return; }
    const data = await r.json();
    add(data.textResponse || JSON.stringify(data), 'bot');
  } catch (err) {
    add('请求失败：' + err.message, 'sys');
  } finally {
    $('send').disabled = false;
    $('q').focus();
  }
});
</script>
</body>
</html>
