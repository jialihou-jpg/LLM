[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "MCP server exposing the pet hospital Go REST API"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.0.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
