[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagent"
version = "0.1.0"
description = "tAgent：核心与界面分离的智能体框架（TUI / Web / Desktop）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.6",
]

[project.optional-dependencies]
tui = [
    "textual>=0.60",
]
mcp = [
    "mcp>=2.0",
]
dev = [
    "pytest>=8",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
tagent-tui = "tui.__main__:main"

[tool.setuptools]
packages = [
    "core",
    "core.llm",
    "core.tools",
    "core.tools.builtin",
    "core.utils",
    "core.skills",
    "core.mcp",
    "tui",
    "tui.widgets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # 工具与模型调用的异常需要被统一转换成可回传给模型的文本，故不使用宽泛捕获告警
    "BLE001",
    # Textual 的 BINDINGS 按框架约定写成可变列表
    "RUF012",
    # 中文文案中的全角标点是有意为之
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
