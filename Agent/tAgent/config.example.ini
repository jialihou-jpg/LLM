; 复制本文件为 config.ini 后填写真实信息（config.ini 已被 .gitignore 忽略）。
; 也可以完全使用环境变量：
;   TAGENT_BASE_URL / TAGENT_API_KEY / TAGENT_MODEL / TAGENT_CONFIG

[llm]
; OpenAI 兼容服务的地址，需包含 /v1 之类的版本前缀
base_url = https://api.siliconflow.cn/v1
; 服务商 API Key
api_key = your-api-key-here
; 模型名称
model = Qwen/Qwen2.5-7B-Instruct
; 单次请求超时时间（秒）
timeout = 60

[agent]
; 单次提问内允许的最大工具调用轮次
max_tool_rounds = 10
; system_prompt = 你是一个乐于助人的助手……

[search]
; 百度千帆「AI 搜索 - 网页搜索」API Key
; 兼容旧配置名 baidu_qianfan_key；也可用环境变量 TAGENT_SEARCH_API_KEY 覆盖
; 接口只返回网页结果、不调用大模型，每月 1500 次免费额度（按天发放）
baidu_qianfan_api_key = your-qianfan-api-key-here
; 搜索版本：standard（标准版，默认）/ turbo（增强版）/ pro（旗舰版），计费规则不同
edition = standard
; 单次搜索请求超时时间（秒）
timeout = 90
; 单次返回的网页数量（1~50）
top_k = 10
